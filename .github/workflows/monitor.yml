name: Monitor

# The 24/7 scheduler. Vercel's Hobby plan caps cron jobs at once a day, which is
# useless for uptime monitoring, so GitHub Actions does the waking up instead and
# the Vercel function does the checking.
#
# Requires two repository secrets:
#   MONITOR_ENDPOINT  e.g. https://status-dog.vercel.app/api/cron/check
#   CRON_SECRET       the same value set in the Vercel environment
#
# GitHub delays scheduled runs under load, so treat 15 minutes as a floor rather
# than a guarantee.
#
# The runner also takes its own look at every target before waking the scheduler.
# It sits on a different network to the Vercel region, so when the two disagree the
# scheduler can tell "the site is down" from "the path to the site is down" and
# stays quiet instead of paging. The runner only measures - whether a status counts
# as healthy is decided server-side, against each target's own expectStatus.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A late run should not pile up behind the next one.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # The second look adds up to 25s per target before the scheduler call, which
    # itself retries twice with a 120s ceiling.
    timeout-minutes: 8
    steps:
      - name: Check out the roster
        uses: actions/checkout@v4
        with:
          sparse-checkout: monitors.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A second opinion from GitHub's network. Deliberately dependency-free: no
      # Node install, no npm, just curl and jq, so it adds seconds rather than
      # minutes to a job that runs every quarter of an hour.
      - name: Look at every target from this runner
        id: vantage
        # A second opinion is an improvement on the checks, never a prerequisite:
        # if this step breaks, the run must still go ahead without it.
        continue-on-error: true
        run: |
          if [ ! -f monitors.json ]; then
            echo "::warning::monitors.json missing - skipping the second opinion."
            exit 0
          fi

          # Tab-separated so a URL containing spaces cannot split a field.
          jq -r '.targets[] | select(.enabled != false) | [.id, .url] | @tsv' monitors.json > targets.tsv

          : > reports.ndjson
          while IFS=$(printf '\t') read -r id url; do
            [ -n "$id" ] || continue

            # Generous timeout on purpose: this vantage exists to catch a slow path,
            # so it must not report "unreachable" for merely being far away.
            code=$(curl --silent --location --output /dev/null \
              --max-time 25 --write-out '%{http_code}' \
              --user-agent 'StatusDog-vantage/1.0 (+https://github.com/alekf9099/StatusDog)' \
              "$url" 2>/dev/null) || code=""

            if [ -n "$code" ] && [ "$code" != "000" ]; then
              jq -nc --arg id "$id" --argjson status "$code" \
                '{id: $id, reachable: true, status: $status}' >> reports.ndjson
              echo "$id -> HTTP $code"
            else
              # curl could not complete the request at all: no DNS, no connection,
              # no handshake, or it ran out of time.
              jq -nc --arg id "$id" '{id: $id, reachable: false, status: null}' >> reports.ndjson
              echo "$id -> unreachable from this runner"
            fi
          done < targets.tsv

          jq -sc '{vantage: {name: "github-actions", checks: .}}' reports.ndjson > vantage.json
          echo "reports=$(jq -r '.vantage.checks | length' vantage.json)" >> "$GITHUB_OUTPUT"

      - name: Trigger scheduled checks
        env:
          MONITOR_ENDPOINT: ${{ secrets.MONITOR_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$MONITOR_ENDPOINT" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::MONITOR_ENDPOINT or CRON_SECRET is not set - skipping."
            exit 0
          fi

          # The second opinion is an optional improvement, so a missing file must
          # not stop the checks from running.
          if [ ! -s vantage.json ]; then
            echo '{}' > vantage.json
          fi

          status=$(curl --silent --show-error \
            --max-time 120 --retry 2 --retry-delay 10 \
            --output response.json --write-out '%{http_code}' \
            --request POST "$MONITOR_ENDPOINT" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header 'content-type: application/json' \
            --data @vantage.json)

          echo "HTTP $status"

          if jq -e . response.json > /dev/null 2>&1; then
            jq . response.json
            {
              if jq -e '.checks' response.json > /dev/null 2>&1; then
                echo "### $(jq -r '.targets') target(s) checked - $(jq -r '.down') down"
                echo
                echo '| Target | State | Status | Response |'
                echo '| --- | --- | --- | --- |'
                jq -r '.checks[] | "| \(.id) | \(.state // "?") | \(.status // "-") | \(.responseTimeMs // "-") ms |"' response.json
                # A disputed check is the interesting case: the two vantage points
                # saw different things, so nothing was concluded and nobody was paged.
                if [ "$(jq -r '(.disputes // []) | length' response.json)" != "0" ]; then
                  echo
                  echo '**Inconclusive - the two vantage points disagreed:**'
                  jq -r '(.disputes // [])[] | "- \(.id): \(.note)"' response.json
                fi

                certs=$(jq -r '(.certWarnings // []) | join(", ")' response.json)
                if [ -n "$certs" ]; then
                  echo
                  echo "**Certificate warnings:** $certs"
                fi

                transitions=$(jq -r '(.transitions // []) | join(", ")' response.json)
                if [ -n "$transitions" ]; then
                  echo
                  echo "**Changed state:** $transitions"
                  echo
                  echo "Alerts: $(jq -r '.alerts.delivered // 0') delivered, $(jq -r '.alerts.failed // 0') failed, across $(jq -r '.alerts.notifiers // 0') notifier(s)"
                  jq -r '(.alerts.outcomes // [])[] | select(.delivered == false) | "- FAILED \(.notifier): \(.error)"' response.json
                fi

                # A webhook that cannot be reached is worth surfacing even though
                # it does not fail the run - otherwise alerting rots unnoticed.
                if [ "$(jq -r '.alerts.failed // 0' response.json)" != "0" ]; then
                  echo "::warning::$(jq -r '.alerts.failed' response.json) alert delivery/deliveries failed"
                fi
              else
                echo '```'
                jq . response.json
                echo '```'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Response was not JSON:"
            head -c 2000 response.json || true
          fi

          # A monitored site being down is not a workflow failure; only the
          # scheduler itself failing is.
          case "$status" in
            2*) exit 0 ;;
            *) echo "::error::Scheduler returned HTTP $status"; exit 1 ;;
          esac
