<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="status.pageTitle">Status — StatusDog</title>
<meta name="description" data-i18n-content="status.metaDescription" content="Uptime, response times and past incidents.">
<link rel="stylesheet" href="/assets/statusdog.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐕</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="mark">🐕</span> StatusDog</a>
    <nav class="site-nav">
      <a href="/" data-i18n="nav.home">Home</a>
      <a href="/office" data-i18n="nav.office">Office</a>
      <a href="/dashboard" data-i18n="nav.dashboard">Dashboard</a>
      <a href="/status" data-i18n="nav.status">Status</a>
      <a href="/docs" data-i18n="nav.docs">Docs</a>
      <span class="lang-switch" role="group" data-i18n-aria-label="lang.switchLabel" aria-label="Language">
        <button type="button" data-lang="en" data-i18n="lang.en">EN</button>
        <button type="button" data-lang="ko" data-i18n="lang.ko">한국어</button>
      </span>
    </nav>
  </div>
</header>

<main class="wrap" style="padding:32px 0 56px;max-width:900px">

  <div class="stale-banner" id="stale-banner" role="status" aria-live="polite" data-visible="false"></div>

  <div id="status-head" style="margin-bottom:24px"></div>
  <div id="status-body"></div>

</main>

<footer class="site-footer">
  <div class="wrap">
    <span data-i18n="footer.license">StatusDog · MIT</span>
    <span class="spacer"></span>
    <a href="/office" data-i18n="nav.office">Office</a>
    <a href="/dashboard" data-i18n="footer.dashboard">Dashboard</a>
    <a href="/api/stats" data-i18n="footer.api">API</a>
    <a href="https://github.com/alekf9099/StatusDog" data-i18n="footer.github">GitHub</a>
  </div>
</footer>

<script type="module">
import { initI18n, t } from '/assets/i18n.js';
import {
  escapeHtml, formatBytes, formatDurationMs, formatMs, formatRelative, formatTimestamp,
  markCurrentNav, prettyUrl, reflectStateInTab, renderStaleBanner, stateBadge,
} from '/assets/statusdog.js';

initI18n();
markCurrentNav();

const head = document.getElementById('status-head');
const body = document.getElementById('status-body');
/**
 * Which target to show.
 *
 * Vercel rewrites /status/<id> to status.html?target=<id> server-side, but the
 * browser URL keeps the pretty path — so the query is empty on exactly the links
 * people share. Read the path too.
 */
// Match /status/<id>, with or without a trailing slash.
const pathTarget = location.pathname.match(/^\/status\/([^/]+)\/?$/)?.[1];
const wanted = new URLSearchParams(location.search).get('target')
  ?? (pathTarget ? decodeURIComponent(pathTarget) : null);

/** Keep the payloads so a language switch re-renders without refetching. */
let stats = null;
let monitors = null;
let reports = null;

async function load() {
  try {
    const [statsRes, monitorsRes, reportsRes] = await Promise.all([
      fetch(`/api/stats?days=90${wanted ? `&target=${encodeURIComponent(wanted)}` : ''}`, { cache: 'no-store' }),
      fetch('/api/monitors?history=0', { cache: 'no-store' }),
      // Only on a single target's page: the detailed reports carry snapshots and
      // a page excerpt, which the overview has no use for.
      wanted
        ? fetch(`/api/incidents?target=${encodeURIComponent(wanted)}&limit=10`, { cache: 'no-store' })
        : Promise.resolve(null),
    ]);
    const statsBody = await statsRes.json();
    if (!statsRes.ok) throw new Error(statsBody.error ?? t('error.requestFailed', { status: statsRes.status }));
    stats = statsBody;
    monitors = monitorsRes.ok ? await monitorsRes.json() : null;
    // A missing report is a thinner incident list, never a broken page.
    reports = reportsRes?.ok ? await reportsRes.json() : null;
    render();
  } catch (err) {
    head.innerHTML = '';
    body.innerHTML = `<div class="notice error">${escapeHtml(err.message)}</div>`;
  }
}

document.addEventListener('statusdog:languagechange', () => {
  if (stats) render();
});

function render() {
  renderStaleBanner(document.getElementById('stale-banner'), monitors?.scheduler ?? null);
  reflectStateInTab(monitors?.monitors ?? []);

  const targets = stats.targets ?? [];
  if (targets.length === 0) {
    head.innerHTML = `<h1 style="font-size:26px;margin:0">${escapeHtml(t('status.h1'))}</h1>`;
    body.innerHTML = `<div class="empty">${escapeHtml(t('status.empty'))}</div>`;
    return;
  }

  if (stats.storage === 'none') {
    head.innerHTML = `<h1 style="font-size:26px;margin:0 0 8px">${escapeHtml(t('status.h1'))}</h1>`;
    body.innerHTML = `<div class="notice">${t('status.noStorageHtml')}</div>`;
    return;
  }

  if (wanted) renderDetail(targets[0]);
  else renderOverview(targets);
}

/* ---------------- overview ---------------- */

function renderOverview(targets) {
  head.innerHTML = `
    <h1 style="font-size:26px;margin:0 0 6px">${escapeHtml(t('status.h1'))}</h1>
    <p class="small muted" style="margin:0">${escapeHtml(t('status.lede'))}</p>`;

  body.innerHTML = targets.map((target) => {
    const month = target.periods?.month;
    const state = stateOf(target.id);
    return `
      <a class="status-target" href="/status/${encodeURIComponent(target.id)}">
        <div class="row">
          ${stateBadge(state)}
          <span class="name">${escapeHtml(target.name)}</span>
          <span style="flex:1"></span>
          <span class="${uptimeClass(month?.uptimePct)}" style="font-weight:650">${uptimeText(month?.uptimePct)}</span>
        </div>
        <div class="url">${escapeHtml(prettyUrl(target.url))}</div>
        ${dayChart(target.daily ?? [], 30)}
      </a>`;
  }).join('');
}

/* ---------------- one target ---------------- */

function renderDetail(target) {
  const state = stateOf(target.id);
  head.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
      ${stateBadge(state)}
      <h1 style="font-size:26px;margin:0">${escapeHtml(target.name)}</h1>
      <span style="flex:1"></span>
      <a href="/status" class="small">${escapeHtml(t('status.allTargets'))}</a>
    </div>
    <p class="small muted" style="margin:0">
      <a href="${escapeHtml(target.url)}" target="_blank" rel="noreferrer noopener">${escapeHtml(prettyUrl(target.url))}</a>
    </p>`;

  body.innerHTML = `
    <h2 style="font-size:15px;margin:26px 0 12px">${escapeHtml(t('status.periods'))}</h2>
    <div class="period-grid">
      ${periodCard('status.period.day', target.periods?.day)}
      ${periodCard('status.period.week', target.periods?.week)}
      ${periodCard('status.period.month', target.periods?.month)}
      ${periodCard('status.period.quarter', target.periods?.quarter)}
    </div>

    <h2 style="font-size:15px;margin:30px 0 4px">${escapeHtml(t('status.daily'))}</h2>
    <p class="small muted" style="margin:0 0 4px">${escapeHtml(t('status.dailyNote', { tz: tzLabel() }))}</p>
    <div class="card">${dayChart(target.daily ?? [], 90)}</div>

    ${shareBox(target)}

    <h2 style="font-size:15px;margin:30px 0 4px">${escapeHtml(t('status.incidents'))}</h2>
    <p class="small muted" style="margin:0 0 12px">${escapeHtml(t('status.report.lede'))}</p>
    ${incidentList(target.incidents ?? [])}`;
}

function periodCard(labelKey, summary) {
  if (!summary || summary.checks === 0) {
    return `
      <div class="period-card">
        <h3>${escapeHtml(t(labelKey))}</h3>
        <div class="period-uptime none">${escapeHtml(t('status.noData'))}</div>
      </div>`;
  }

  return `
    <div class="period-card">
      <h3>${escapeHtml(t(labelKey))}</h3>
      <div class="period-uptime ${uptimeClass(summary.uptimePct)}">${uptimeText(summary.uptimePct)}</div>
      <div class="period-rows">
        <div><span>${escapeHtml(t('status.p50'))}</span><b>${formatMs(summary.p50Ms)}</b></div>
        <div><span>${escapeHtml(t('status.p95'))}</span><b>${formatMs(summary.p95Ms)}</b></div>
        <div><span>${escapeHtml(t('status.downtime'))}</span><b>${escapeHtml(formatDurationMs(summary.downtimeMs))}</b></div>
        <div><span>${escapeHtml(t('status.incidentCount'))}</span><b>${summary.incidents}</b></div>
        <div><span>${escapeHtml(t('status.checks'))}</span><b>${summary.checks}</b></div>
      </div>
    </div>`;
}

/** One bar per day, coloured by that day's uptime. */
function dayChart(daily, days) {
  const window = daily.slice(-days);
  if (window.length === 0) {
    return `<div class="small muted">${escapeHtml(t('status.noData'))}</div>`;
  }

  const bars = window.map((bucket) => {
    const uptime = bucket.checks > 0
      ? ((bucket.checks - bucket.failures) / bucket.checks) * 100
      : null;
    const title = uptime === null
      ? bucket.day
      : `${bucket.day} · ${Math.round(uptime * 100) / 100}% · ${bucket.checks} ${t('status.checks')}`;
    return `<i class="${uptimeClass(uptime)}" title="${escapeHtml(title)}"></i>`;
  }).join('');

  return `
    <div class="day-chart">${bars}</div>
    <div class="day-axis">
      <span>${escapeHtml(window[0].day)}</span>
      <span>${escapeHtml(window[window.length - 1].day)}</span>
    </div>`;
}

/**
 * The two things a reader can take away with them: a feed address and a badge.
 *
 * Both are plain URLs on purpose. Subscribing needs no account because RSS needs
 * none, and the badge is one SVG someone can paste into a README — the markdown is
 * pre-written because nobody wants to assemble that by hand.
 */
function shareBox(target) {
  const origin = location.origin;
  const feed = `${origin}/api/feed?target=${encodeURIComponent(target.id)}`;
  const badge = `${origin}/api/badge?target=${encodeURIComponent(target.id)}`;
  const markdown = `[![${target.name}](${badge})](${origin}/status/${encodeURIComponent(target.id)})`;

  return `
    <h2 style="font-size:15px;margin:30px 0 4px">${escapeHtml(t('status.subscribe'))}</h2>
    <div class="card share-row">
      <div class="share-box">
        <h3>RSS</h3>
        <p class="small muted" style="margin:0">${escapeHtml(t('status.subscribeNote'))}</p>
        <div class="share-field">
          <input type="text" readonly value="${escapeHtml(feed)}" aria-label="RSS">
          <button type="button" class="secondary" data-copy="${escapeHtml(feed)}">${escapeHtml(t('status.copy'))}</button>
        </div>
      </div>
      <div class="share-box">
        <h3>${escapeHtml(t('status.badge'))}</h3>
        <p class="small muted" style="margin:0">${escapeHtml(t('status.badgeNote'))}</p>
        <div class="share-field">
          <input type="text" readonly value="${escapeHtml(markdown)}" aria-label="${escapeHtml(t('status.badge'))}">
          <button type="button" class="secondary" data-copy="${escapeHtml(markdown)}">${escapeHtml(t('status.copy'))}</button>
        </div>
        <div class="share-preview"><img src="${escapeHtml(badge)}" alt="${escapeHtml(t('status.badge'))}"></div>
      </div>
    </div>`;
}

// One listener for the whole page: the boxes are re-rendered on every poll and on
// every language switch, so per-button handlers would leak.
document.addEventListener('click', async (event) => {
  const button = event.target.closest?.('[data-copy]');
  if (!button) return;
  try {
    await navigator.clipboard.writeText(button.dataset.copy);
    const original = button.textContent;
    button.textContent = t('status.copied');
    setTimeout(() => { button.textContent = original; }, 1500);
  } catch {
    // Clipboard access can be refused; the field is selectable either way.
    button.closest('.share-field')?.querySelector('input')?.select();
  }
});

/* ---------------- incidents ---------------- */

/** The detailed report for an incident, when one was recorded. */
function reportFor(startedAt) {
  return reports?.targets?.[0]?.reports?.find((report) => report.confirmedAt === startedAt) ?? null;
}

function incidentList(incidents) {
  if (incidents.length === 0) {
    return `<div class="empty">${escapeHtml(t('status.noIncidents'))}</div>`;
  }
  return incidents.map((incident) => incidentEntry(incident, reportFor(incident.startedAt))).join('');
}

function incidentEntry(incident, report) {
  const ongoing = incident.endedAt === null;
  const duration = ongoing ? t('status.ongoing') : formatDurationMs(incident.durationMs ?? 0);

  const head = `
    <summary>
      <span class="when">${escapeHtml(formatTimestamp(incident.startedAt) ?? '')}</span>
      <span class="dur">${escapeHtml(duration)}</span>
      <span class="reason">${escapeHtml(incident.reason ?? '–')}</span>
      ${report ? '' : `<span class="small muted">${escapeHtml(t('status.report.summaryOnly'))}</span>`}
    </summary>`;

  // Incidents from before reports existed keep the one line they always had.
  const body = report
    ? reportBody(report)
    : `<p class="small muted">${escapeHtml(incident.message ?? t('status.report.noDetail'))}</p>`;

  return `<details class="incident-report${ongoing ? ' ongoing' : ''}">${head}<div class="report-body">${body}</div></details>`;
}

function reportBody(report) {
  return [
    timelineOf(report),
    precursorOf(report),
    snapshotsOf(report),
    changedOf(report),
  ].filter(Boolean).join('');
}

function row(labelKey, value) {
  if (value === null || value === undefined || value === '') return '';
  return `<div><span>${escapeHtml(t(labelKey))}</span><b>${escapeHtml(String(value))}</b></div>`;
}

function timelineOf(report) {
  const alerts = report.alerts
    ? t('status.report.alertsValue', {
        delivered: report.alerts.delivered,
        attempted: report.alerts.attempted,
      })
    : t('status.report.alertsUnknown');

  return `
    <h4>${escapeHtml(t('status.report.timeline'))}</h4>
    <div class="report-rows">
      ${row('status.report.firstFailure', stamp(report.firstFailureAt))}
      ${row('status.report.confirmed', stamp(report.confirmedAt))}
      ${row('status.report.detection', t('status.report.detectionValue', {
        time: formatDurationMs(report.detectionMs ?? 0),
        checks: report.failureChecks,
      }))}
      ${row('status.report.firstSuccess', stamp(report.firstSuccessAt))}
      ${row('status.report.recovered', stamp(report.recoveredAt))}
      ${row('status.report.alerts', alerts)}
      ${report.vantage ? row('status.report.vantage', t(`status.report.vantage.${report.vantage}`)) : ''}
    </div>`;
}

/**
 * The checks just before it fell over.
 *
 * A site that crept from 200ms to 1.9s failed differently from one that died
 * instantly, and this is the only place that distinction is visible.
 */
function precursorOf(report) {
  const points = report.precursor ?? [];
  if (points.length === 0) return '';

  const max = Math.max(...points.map((point) => point.ms || 0), 1);
  const bars = points.map((point) => {
    const height = Math.max(10, Math.round(((point.ms || 0) / max) * 100));
    const unclear = point.reason === 'disputed';
    const cls = unclear ? 'unclear' : point.ok ? '' : 'bad';
    const label = unclear ? t('spark.disputed') : point.ok ? t('state.up') : point.reason || t('state.down');
    return `<i class="${cls}" style="height:${height}%" title="${escapeHtml(`${point.t} · ${label} · ${formatMs(point.ms)}`)}"></i>`;
  }).join('');

  return `
    <h4>${escapeHtml(t('status.report.precursor'))}</h4>
    <div class="spark">${bars}</div>
    <p class="small muted" style="margin:6px 0 0">${escapeHtml(t('status.report.precursorNote', {
      from: formatMs(points[0].ms),
      to: formatMs(points[points.length - 1].ms),
    }))}</p>`;
}

function snapshotColumn(titleKey, snap) {
  if (!snap) {
    return `
      <div class="snapshot">
        <h5>${escapeHtml(t(titleKey))}</h5>
        <p class="small muted">${escapeHtml(t('status.report.stillOpen'))}</p>
      </div>`;
  }

  return `
    <div class="snapshot">
      <h5>${escapeHtml(t(titleKey))}</h5>
      <div class="report-rows">
        ${row('status.report.at', stamp(snap.at))}
        ${row('metric.status', snap.status ?? t('status.report.noAnswer'))}
        ${row('metric.response', formatMs(snap.responseTimeMs))}
        ${row('status.field.peer', snap.peer)}
        ${row('status.field.server', snap.server)}
        ${row('status.field.contentType', snap.contentType)}
        ${row('status.field.bodySize', snap.bodySize === null ? null : formatBytes(snap.bodySize))}
        ${row('status.field.tlsProtocol', snap.tlsProtocol)}
      </div>
      ${snap.message ? `<p class="small" style="margin:8px 0 0">${escapeHtml(snap.message)}</p>` : ''}
      ${snap.bodyExcerpt ? `
        <p class="small muted" style="margin:10px 0 4px">${escapeHtml(t('status.report.excerpt'))}</p>
        <pre class="excerpt">${escapeHtml(snap.bodyExcerpt)}</pre>` : ''}
    </div>`;
}

function snapshotsOf(report) {
  return `
    <h4>${escapeHtml(t('status.report.snapshots'))}</h4>
    <div class="snapshots">
      ${snapshotColumn('status.report.whenFailing', report.failure)}
      ${snapshotColumn('status.report.whenRecovered', report.recovery)}
    </div>`;
}

/**
 * What was observably different once it worked again.
 *
 * Deliberately not labelled as the cause. StatusDog watches from outside the site
 * and cannot see a service being restarted or a deploy rolled back, so this is
 * evidence for a person to interpret and the wording has to say so.
 */
function changedOf(report) {
  if (!report.recovery) return '';

  const changes = report.changed ?? [];
  if (changes.length === 0) {
    return `
      <h4>${escapeHtml(t('status.report.changed'))}</h4>
      <p class="small muted">${escapeHtml(t('status.report.noChange'))}</p>`;
  }

  const items = changes.map((change) => {
    const label = t(`status.field.${change.field}`);
    const from = change.field === 'bodySize' ? formatBytes(change.from) : (change.from ?? t('status.report.absent'));
    const to = change.field === 'bodySize' ? formatBytes(change.to) : (change.to ?? t('status.report.absent'));
    return `<li><span>${escapeHtml(label)}</span> <code>${escapeHtml(from)}</code> → <code>${escapeHtml(to)}</code></li>`;
  }).join('');

  return `
    <h4>${escapeHtml(t('status.report.changed'))}</h4>
    <ul class="changed">${items}</ul>
    <p class="small muted" style="margin:8px 0 0">${escapeHtml(t('status.report.evidenceNote'))}</p>`;
}

const stamp = formatTimestamp;

/* ---------------- helpers ---------------- */

function stateOf(id) {
  return monitors?.monitors?.find((monitor) => monitor.id === id)?.state ?? 'unknown';
}

function uptimeClass(pct) {
  if (pct === null || pct === undefined) return 'empty';
  if (pct >= 99.5) return 'good';
  if (pct >= 97) return 'fair';
  return 'poor';
}

function uptimeText(pct) {
  return pct === null || pct === undefined ? t('status.noData') : `${pct}%`;
}

function tzLabel() {
  const minutes = stats?.timezoneOffsetMinutes ?? 0;
  if (minutes === 0) return 'UTC';
  const sign = minutes > 0 ? '+' : '-';
  const abs = Math.abs(minutes);
  return `UTC${sign}${String(Math.floor(abs / 60)).padStart(2, '0')}:${String(abs % 60).padStart(2, '0')}`;
}

load();
setInterval(load, 120_000);
</script>

</body>
</html>
