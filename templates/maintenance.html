<!doctype html>
<!--
  Custom StatusDog fallback template.

  Point a target at it with:
    "fallback": { "template": "templates/maintenance.html" }

  Available placeholders:
    {{title}} {{message}} {{targetName}} {{targetUrl}}
    {{statusCode}} {{retryAfterSeconds}} {{lastChecked}} {{year}}
  …plus every key under `fallback.vars` (this file uses {{supportEmail}}).
  Unknown placeholders render as an empty string.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="{{retryAfterSeconds}}">
  <title>{{title}}</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; --accent: #2f81f7; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1216; --fg: #e9edf2; --muted: #98a2ae; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 10px; }
    a { color: var(--accent); }
    .meta { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    <p>Need help right away? Email <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.</p>
    <p class="meta">
      {{targetName}} &middot; last checked {{lastChecked}} &middot; HTTP {{statusCode}}<br>
      This page reloads automatically every {{retryAfterSeconds}} seconds.
    </p>
  </main>
</body>
</html>
